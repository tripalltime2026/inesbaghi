name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', coverage: none}
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: node --check public/js/site.js
      - run: node --check public/js/portal.js
      - run: node --check public/js/cms-public.js
      - run: node --check public/js/cms-portal.js
      - run: node --check public/js/experience-v2.js
      - run: node --check public/js/experience-v2-compat.js
      - run: node --check public/js/parent-forum.js
      - run: node --check public/js/privacy-compliance.js
      - name: Validate zero-config demo bootstrap
        run: env -u APP_KEY DEMO_AUTH_ENABLED=true DB_CONNECTION=sqlite SESSION_DRIVER=file CACHE_STORE=file php artisan about --only=environment
      - name: Compile all Blade views
        run: php artisan view:cache
      - run: php artisan test
